<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" role="img" aria-label="Headphones, speaker, phone, DAC, car audio and studio monitor">
  <title>Where Naad ships</title>
  <defs>
    <linearGradient id="dv" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#7FB8FF"/><stop offset="45%" stop-color="#2E7BFF"/>
      <stop offset="100%" stop-color="#0B3D8F"/>
    </linearGradient>
    <linearGradient id="dvlit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".55"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#dv)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- headphones -->
    <g transform="translate(40,44)">
      <path d="M 8 62 V 44 a 52 52 0 0 1 104 0 V 62"/>
      <rect x="0" y="58" width="26" height="46" rx="11" fill="url(#dv)" stroke="none"/>
      <rect x="94" y="58" width="26" height="46" rx="11" fill="url(#dv)" stroke="none"/>
      <rect x="3" y="62" width="20" height="12" rx="6" fill="url(#dvlit)" stroke="none"/>
    </g>
    <!-- bookshelf speaker -->
    <g transform="translate(240,32)">
      <rect x="6" y="4" width="92" height="132" rx="10"/>
      <circle cx="52" cy="52" r="24"/><circle cx="52" cy="52" r="8" fill="url(#dv)" stroke="none"/>
      <circle cx="52" cy="108" r="13"/>
      <rect x="14" y="10" width="76" height="16" rx="8" fill="url(#dvlit)" stroke="none"/>
    </g>
    <!-- phone -->
    <g transform="translate(430,30)">
      <rect x="10" y="2" width="76" height="136" rx="14"/>
      <line x1="38" y1="16" x2="58" y2="16"/>
      <rect x="18" y="8" width="60" height="18" rx="9" fill="url(#dvlit)" stroke="none"/>
    </g>
    <!-- DAC / amp -->
    <g transform="translate(590,52)">
      <rect x="4" y="18" width="150" height="72" rx="10"/>
      <circle cx="40" cy="54" r="17"/><line x1="40" y1="54" x2="40" y2="42"/>
      <line x1="80" y1="40" x2="140" y2="40"/><line x1="80" y1="54" x2="140" y2="54"/><line x1="80" y1="68" x2="140" y2="68"/>
      <rect x="14" y="24" width="130" height="14" rx="7" fill="url(#dvlit)" stroke="none"/>
    </g>
    <!-- car audio -->
    <g transform="translate(800,46)">
      <path d="M 6 84 l 16 -44 a 14 14 0 0 1 13 -9 h 84 a 14 14 0 0 1 13 9 l 16 44"/>
      <path d="M 6 84 h 142 v 22 h -22 v -10 H 28 v 10 H 6 Z"/>
      <circle cx="46" cy="66" r="9" fill="url(#dv)" stroke="none"/>
      <circle cx="108" cy="66" r="9" fill="url(#dv)" stroke="none"/>
    </g>
    <!-- studio monitor -->
    <g transform="translate(1010,28)">
      <path d="M 14 140 L 26 8 h 96 l 12 132 Z"/>
      <circle cx="74" cy="56" r="26"/><circle cx="74" cy="56" r="9" fill="url(#dv)" stroke="none"/>
      <circle cx="74" cy="112" r="14"/>
      <rect x="34" y="14" width="80" height="15" rx="7" fill="url(#dvlit)" stroke="none"/>
    </g>
  </g>
</svg>
