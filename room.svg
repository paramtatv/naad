<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A listening room at night: two tall speakers, an armchair, a floor lamp, records on a shelf, the city through the window">
  <title>Your room</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D0618"/><stop offset=".55" stop-color="#1A0F2E"/><stop offset="1" stop-color="#241640"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2420"/><stop offset="1" stop-color="#0E0B09"/>
    </linearGradient>
    <linearGradient id="floorsheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7AF5" stop-opacity="0"/><stop offset=".5" stop-color="#FF7AF5" stop-opacity=".14"/><stop offset="1" stop-color="#FF7AF5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06030F"/><stop offset=".7" stop-color="#1A0B3A"/><stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <radialGradient id="lamp">
      <stop offset="0" stop-color="#FFD1FB" stop-opacity=".95"/><stop offset=".25" stop-color="#FF7AF5" stop-opacity=".45"/><stop offset="1" stop-color="#FF7AF5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampwide">
      <stop offset="0" stop-color="#FF7AF5" stop-opacity=".30"/><stop offset="1" stop-color="#FF7AF5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lac" x1="0" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#D8B4FE"/><stop offset=".3" stop-color="#9333EA"/><stop offset=".7" stop-color="#6D28D9"/><stop offset="1" stop-color="#3B0764"/>
    </linearGradient>
    <linearGradient id="lacdark" x1="0" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#7E22CE"/><stop offset=".5" stop-color="#4C1D95"/><stop offset="1" stop-color="#2E1065"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".35" stop-color="#fff" stop-opacity=".1"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cone" cx=".42" cy=".38" r=".62">
      <stop offset="0" stop-color="#E9D5FF"/><stop offset=".35" stop-color="#7C3AED"/><stop offset=".8" stop-color="#3B0764"/><stop offset="1" stop-color="#A855F7"/>
    </radialGradient>
    <radialGradient id="dome" cx=".35" cy=".3" r=".7">
      <stop offset="0" stop-color="#FAF5FF"/><stop offset=".4" stop-color="#C084FC"/><stop offset="1" stop-color="#3B0764"/>
    </radialGradient>
    <radialGradient id="red" cx=".34" cy=".28" r=".78">
      <stop offset="0" stop-color="#FF7AF5"/><stop offset=".32" stop-color="#F038E0"/><stop offset=".72" stop-color="#A21CAF"/><stop offset="1" stop-color="#701A75"/>
    </radialGradient>
    <linearGradient id="chair" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#6B4A3A"/><stop offset=".5" stop-color="#3E2A21"/><stop offset="1" stop-color="#1E140F"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A3F2E"/><stop offset="1" stop-color="#2E1F16"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE4FC"/><stop offset="1" stop-color="#F0A7EC"/>
    </linearGradient>
    <radialGradient id="shadow">
      <stop offset="0" stop-color="#000" stop-opacity=".6"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blursm" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
    <!-- one floor-standing speaker -->
    <g id="tower">
      <rect x="-56" y="-300" width="112" height="340" rx="10" fill="url(#lac)"/>
      <rect x="-56" y="-300" width="112" height="340" rx="10" fill="url(#sweep)"/>
      <rect x="-49" y="-292" width="98" height="326" rx="7" fill="url(#lacdark)" opacity=".85"/>
      <ellipse cx="0" cy="-240" rx="26" ry="22" fill="#120826"/><ellipse cx="0" cy="-240" rx="22" ry="18" fill="url(#cone)"/><circle cx="0" cy="-240" r="8" fill="url(#dome)"/>
      <circle cx="0" cy="-150" r="40" fill="#120826"/><circle cx="0" cy="-150" r="37" fill="url(#cone)"/><circle cx="0" cy="-150" r="21" fill="url(#cone)" opacity=".9"/><circle cx="0" cy="-150" r="10" fill="url(#dome)"/>
      <circle cx="0" cy="-50" r="40" fill="#120826"/><circle cx="0" cy="-50" r="37" fill="url(#cone)"/><circle cx="0" cy="-50" r="21" fill="url(#cone)" opacity=".9"/><circle cx="0" cy="-50" r="10" fill="url(#dome)"/>
      <circle cx="34" cy="22" r="3" fill="url(#red)"/>
      <rect x="-62" y="38" width="124" height="10" rx="4" fill="#0A0612"/>
    </g>
    <!-- a record spine on the shelf -->
    <g id="spine"><rect x="0" y="0" width="7" height="120" rx="1"/></g>
  </defs>

  <!-- the room -->
  <rect width="1600" height="900" fill="url(#wall)"/>
  <!-- window, city at night -->
  <rect x="980" y="110" width="440" height="420" rx="6" fill="#02040A"/>
  <rect x="990" y="120" width="420" height="400" fill="url(#night)"/>
  <!-- distant towers and their lit windows -->
  <g fill="#1E0B3A">
    <rect x="1000" y="330" width="46" height="190"/><rect x="1056" y="290" width="38" height="230"/><rect x="1104" y="350" width="60" height="170"/>
    <rect x="1176" y="260" width="34" height="260"/><rect x="1220" y="320" width="52" height="200"/><rect x="1284" y="300" width="40" height="220"/>
    <rect x="1334" y="360" width="70" height="160"/>
  </g>
  <g fill="#FFD1FB" opacity=".75">
    <rect x="1008" y="350" width="5" height="7"/><rect x="1022" y="368" width="5" height="7"/><rect x="1032" y="400" width="5" height="7"/><rect x="1012" y="430" width="5" height="7"/>
    <rect x="1066" y="310" width="5" height="7"/><rect x="1078" y="340" width="5" height="7"/><rect x="1064" y="380" width="5" height="7"/><rect x="1080" y="420" width="5" height="7"/>
    <rect x="1118" y="372" width="5" height="7"/><rect x="1140" y="390" width="5" height="7"/><rect x="1126" y="430" width="5" height="7"/><rect x="1150" y="460" width="5" height="7"/>
    <rect x="1186" y="280" width="5" height="7"/><rect x="1196" y="320" width="5" height="7"/><rect x="1184" y="370" width="5" height="7"/><rect x="1198" y="410" width="5" height="7"/>
    <rect x="1232" y="340" width="5" height="7"/><rect x="1252" y="360" width="5" height="7"/><rect x="1240" y="400" width="5" height="7"/><rect x="1258" y="450" width="5" height="7"/>
    <rect x="1294" y="320" width="5" height="7"/><rect x="1308" y="350" width="5" height="7"/><rect x="1296" y="400" width="5" height="7"/><rect x="1312" y="440" width="5" height="7"/>
    <rect x="1346" y="380" width="5" height="7"/><rect x="1372" y="400" width="5" height="7"/><rect x="1388" y="430" width="5" height="7"/><rect x="1356" y="470" width="5" height="7"/>
  </g>
  <!-- window frame and the reflection on the glass -->
  <rect x="990" y="120" width="420" height="400" fill="none" stroke="#2B1D45" stroke-width="12"/>
  <path d="M1200 120 V520 M990 320 H1410" stroke="#2B1D45" stroke-width="8"/>
  <rect x="990" y="120" width="420" height="400" fill="#FF7AF5" opacity=".04"/>

  <!-- the floor -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#floor)"/>
  <rect x="0" y="640" width="1600" height="260" fill="url(#floorsheen)"/>
  <path d="M0 640 H1600" stroke="#000" stroke-opacity=".5"/>

  <!-- the lamp's light, before the objects, so they sit in it -->
  <circle cx="740" cy="330" r="520" fill="url(#lampwide)"/>
  <circle cx="740" cy="330" r="200" fill="url(#lamp)" filter="url(#blur)"/>
  <ellipse cx="740" cy="700" rx="420" ry="90" fill="#FF7AF5" opacity=".12" filter="url(#blur)"/>

  <!-- record shelf, left -->
  <rect x="80" y="420" width="360" height="12" rx="2" fill="url(#wood)"/>
  <rect x="80" y="552" width="360" height="12" rx="2" fill="url(#wood)"/>
  <g transform="translate(96,430)" fill="#1E1233">
    <use xlink:href="#spine" x="0" fill="#3B2A5E"/><use xlink:href="#spine" x="9" fill="#A21CAF"/><use xlink:href="#spine" x="18"/><use xlink:href="#spine" x="27" fill="#4C3A80"/>
    <use xlink:href="#spine" x="36" fill="#E8DCC8"/><use xlink:href="#spine" x="45"/><use xlink:href="#spine" x="54" fill="#7C3AED"/><use xlink:href="#spine" x="63" fill="#3B2A5E"/>
    <use xlink:href="#spine" x="72"/><use xlink:href="#spine" x="81" fill="#701A75"/><use xlink:href="#spine" x="90" fill="#4C3A80"/><use xlink:href="#spine" x="99"/>
    <use xlink:href="#spine" x="108" fill="#E8DCC8"/><use xlink:href="#spine" x="117" fill="#3B2A5E"/><use xlink:href="#spine" x="126"/><use xlink:href="#spine" x="135" fill="#7C3AED"/>
    <use xlink:href="#spine" x="144" fill="#4C3A80"/><use xlink:href="#spine" x="153"/><use xlink:href="#spine" x="162" fill="#A21CAF"/><use xlink:href="#spine" x="171" fill="#3B2A5E"/>
    <use xlink:href="#spine" x="180"/><use xlink:href="#spine" x="189" fill="#E8DCC8"/><use xlink:href="#spine" x="198" fill="#4C3A80"/><use xlink:href="#spine" x="207"/>
    <use xlink:href="#spine" x="216" fill="#7C3AED"/><use xlink:href="#spine" x="225" fill="#3B2A5E"/><use xlink:href="#spine" x="234"/><use xlink:href="#spine" x="243" fill="#701A75"/>
    <!-- one record leaning out, face on -->
    <g transform="translate(262,2) skewY(-4)"><rect width="110" height="118" rx="2" fill="#E8DCC8"/><rect x="6" y="6" width="98" height="106" fill="#0F0620"/><circle cx="55" cy="59" r="36" fill="#140C24"/><circle cx="55" cy="59" r="13" fill="url(#red)"/></g>
  </g>
  <!-- a turntable on the lower shelf -->
  <g transform="translate(180,480)">
    <rect x="0" y="40" width="200" height="30" rx="4" fill="#1E1233"/>
    <ellipse cx="100" cy="42" rx="82" ry="18" fill="#07040E"/><ellipse cx="100" cy="40" rx="78" ry="16" fill="#17102A"/>
    <ellipse cx="100" cy="40" rx="24" ry="5" fill="url(#red)"/>
    <path d="M186 20 L120 36" stroke="#CBB8E8" stroke-width="3" stroke-linecap="round"/><circle cx="186" cy="20" r="6" fill="#6B5A8A"/>
  </g>

  <!-- the speakers -->
  <ellipse cx="560" cy="676" rx="110" ry="22" fill="url(#shadow)" filter="url(#blursm)"/>
  <ellipse cx="1080" cy="676" rx="110" ry="22" fill="url(#shadow)" filter="url(#blursm)"/>
  <g transform="translate(560,640)"><use xlink:href="#tower"/></g>
  <g transform="translate(1080,640)"><use xlink:href="#tower"/></g>

  <!-- the lamp -->
  <ellipse cx="760" cy="672" rx="40" ry="9" fill="#000" opacity=".5" filter="url(#blursm)"/>
  <rect x="757" y="330" width="6" height="340" fill="#2B1D45"/>
  <ellipse cx="760" cy="668" rx="34" ry="8" fill="#1E1233"/>
  <path d="M700 290 L820 290 L844 350 L676 350 Z" fill="url(#shade)"/>
  <path d="M700 290 L820 290 L844 350 L676 350 Z" fill="#fff" opacity=".15"/>
  <ellipse cx="760" cy="350" rx="84" ry="10" fill="#FFD1FB" opacity=".9"/>

  <!-- the chair, facing the speakers, seen from behind: where you sit -->
  <ellipse cx="820" cy="840" rx="200" ry="40" fill="url(#shadow)" filter="url(#blursm)"/>
  <path d="M640 900 V640 C640 600 680 580 720 580 H920 C960 580 1000 600 1000 640 V900 Z" fill="url(#chair)"/>
  <path d="M640 900 V640 C640 600 680 580 720 580 H920 C960 580 1000 600 1000 640 V900 Z" fill="url(#sweep)" opacity=".5"/>
  <path d="M660 640 C660 614 690 600 720 600 H920 C950 600 980 614 980 640" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>
  <rect x="600" y="700" width="60" height="200" rx="18" fill="url(#chair)"/>
  <rect x="980" y="700" width="60" height="200" rx="18" fill="url(#chair)"/>
</svg>
