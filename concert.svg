<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A festival crowd under stage lights, hands raised, haze in the beams">
  <title>Six hours, not one dropout</title>
  <defs>
    <!-- night air: deep navy at the top, lifting to the blue of the lit haze near the stage -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050A18"/>
      <stop offset=".45" stop-color="#0B1A3E"/>
      <stop offset=".78" stop-color="#143A86"/>
      <stop offset="1" stop-color="#0A1F4F"/>
    </linearGradient>
    <!-- the LED wall behind the stage, seen through haze -->
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E63DC" stop-opacity="0"/>
      <stop offset=".18" stop-color="#5FA0FF" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#DCEBFF"/>
      <stop offset=".82" stop-color="#5FA0FF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#1E63DC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wallfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".6" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".9"/>
    </linearGradient>
    <!-- one beam, fading along its length; reused at several angles -->
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset=".12" stop-color="#CFE3FF" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#7FB4FF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#5FA0FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamwarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset=".12" stop-color="#FFC9B8" stop-opacity=".5"/>
      <stop offset=".6" stop-color="#FF8A74" stop-opacity=".16"/>
      <stop offset="1" stop-color="#DC4A33" stop-opacity="0"/>
    </linearGradient>
    <!-- the hot core at each fixture -->
    <radialGradient id="flare">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".18" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#BBD6FF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#5FA0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flarewarm">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".2" stop-color="#FFE2D9" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#FF8A74" stop-opacity=".35"/>
      <stop offset="1" stop-color="#DC4A33" stop-opacity="0"/>
    </radialGradient>
    <!-- haze pools where beams meet the air near the floor -->
    <radialGradient id="haze">
      <stop offset="0" stop-color="#8FC0FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8FC0FF" stop-opacity="0"/>
    </radialGradient>
    <!-- the crowd is lit from behind: rim light on heads and hands, bodies dark -->
    <linearGradient id="crowdfar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B3C7C"/><stop offset="1" stop-color="#0A1838"/>
    </linearGradient>
    <linearGradient id="crowdmid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1D44"/><stop offset="1" stop-color="#040A1E"/>
    </linearGradient>
    <linearGradient id="crowdnear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040B20"/><stop offset="1" stop-color="#02050F"/>
    </linearGradient>
    <linearGradient id="vig" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#03081A" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#03081A" stop-opacity=".15"/>
      <stop offset="1" stop-color="#03081A" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>

    <!-- one row of people: heads, shoulders, raised arms, a few phones held up.
         Drawn once, placed many times at three depths. -->
    <g id="row">
      <!-- shoulders as a continuous rolling edge -->
      <path d="M0 70 C 18 52 34 52 52 66 S 86 48 104 64 S 140 44 160 62 S 196 50 214 68 S 250 46 270 64 S 306 52 324 66 S 360 44 380 60 S 416 52 436 68 S 472 48 490 62 S 526 54 546 68 S 582 46 600 62 L600 800 L0 800 Z"/>
      <!-- heads -->
      <circle cx="30" cy="46" r="15"/><circle cx="82" cy="40" r="16"/><circle cx="134" cy="44" r="14"/>
      <circle cx="190" cy="42" r="16"/><circle cx="246" cy="38" r="15"/><circle cx="300" cy="46" r="14"/>
      <circle cx="352" cy="36" r="16"/><circle cx="408" cy="44" r="15"/><circle cx="462" cy="38" r="14"/>
      <circle cx="516" cy="46" r="16"/><circle cx="570" cy="40" r="15"/>
      <!-- raised arms: a line and a hand -->
      <g stroke-linecap="round" stroke-width="7" fill="none">
        <path d="M70 58 L58 2"/><path d="M98 56 L116 6"/><path d="M236 52 L224 -6"/><path d="M362 50 L380 -2"/>
        <path d="M454 54 L440 0"/><path d="M530 58 L552 4"/><path d="M178 56 L166 10"/>
      </g>
      <circle cx="57" cy="-2" r="5.5"/><circle cx="117" cy="2" r="5.5"/><circle cx="223" cy="-10" r="5.5"/>
      <circle cx="381" cy="-6" r="5.5"/><circle cx="439" cy="-4" r="5.5"/><circle cx="553" cy="0" r="5.5"/><circle cx="165" cy="6" r="5.5"/>
    </g>
    <!-- phone screens held up, lit -->
    <g id="phones" fill="#DCEBFF">
      <rect x="112" y="-4" width="9" height="15" rx="2" opacity=".85"/>
      <rect x="376" y="-12" width="9" height="15" rx="2" opacity=".75"/>
      <rect x="548" y="-6" width="9" height="15" rx="2" opacity=".8"/>
    </g>
  </defs>

  <!-- 1 · the air -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- 2 · the LED wall and stage glow, far back, through haze -->
  <g filter="url(#softer)">
    <rect x="300" y="470" width="1000" height="90" fill="url(#wall)"/>
    <ellipse cx="800" cy="560" rx="620" ry="150" fill="url(#haze)"/>
  </g>
  <rect x="330" y="486" width="940" height="60" fill="url(#wall)" opacity=".7" filter="url(#soft)"/>
  <rect x="330" y="486" width="940" height="60" fill="url(#wallfade)" opacity=".35" filter="url(#soft)"/>

  <!-- 3 · the beams, from a truss above the frame; each is a tapered quad with a soft edge -->
  <g filter="url(#edge)">
    <polygon points="250,-40 300,-40 640,900 420,900" fill="url(#beam)"/>
    <polygon points="520,-40 560,-40 980,900 760,900" fill="url(#beam)"/>
    <polygon points="800,-40 840,-40 1190,900 980,900" fill="url(#beam)" opacity=".85"/>
    <polygon points="1060,-40 1100,-40 1370,900 1180,900" fill="url(#beam)"/>
    <polygon points="1330,-40 1370,-40 1620,900 1480,900" fill="url(#beam)" opacity=".8"/>
    <!-- two warm beams, the page's red, crossing the blue -->
    <polygon points="700,-40 740,-40 180,900 20,900" fill="url(#beamwarm)" opacity=".9"/>
    <polygon points="1200,-40 1240,-40 720,900 560,900" fill="url(#beamwarm)" opacity=".75"/>
  </g>
  <!-- the bright cores, tighter -->
  <g opacity=".55">
    <polygon points="272,-40 282,-40 540,900 500,900" fill="url(#beam)"/>
    <polygon points="536,-40 546,-40 880,900 840,900" fill="url(#beam)"/>
    <polygon points="818,-40 826,-40 1100,900 1060,900" fill="url(#beam)"/>
    <polygon points="1076,-40 1086,-40 1290,900 1250,900" fill="url(#beam)"/>
    <polygon points="718,-40 726,-40 100,900 60,900" fill="url(#beamwarm)"/>
  </g>
  <!-- fixture flares at the top edge -->
  <g>
    <circle cx="276" cy="0" r="120" fill="url(#flare)"/>
    <circle cx="541" cy="0" r="110" fill="url(#flare)"/>
    <circle cx="822" cy="0" r="100" fill="url(#flare)"/>
    <circle cx="1081" cy="0" r="110" fill="url(#flare)"/>
    <circle cx="1351" cy="0" r="100" fill="url(#flare)"/>
    <circle cx="722" cy="0" r="120" fill="url(#flarewarm)"/>
    <circle cx="1221" cy="0" r="110" fill="url(#flarewarm)"/>
  </g>

  <!-- 4 · haze pools where the beams land -->
  <g filter="url(#softer)" opacity=".8">
    <ellipse cx="520" cy="640" rx="260" ry="90" fill="url(#haze)"/>
    <ellipse cx="1040" cy="650" rx="300" ry="100" fill="url(#haze)"/>
    <ellipse cx="120" cy="700" rx="200" ry="80" fill="#FF8A74" opacity=".35"/>
    <ellipse cx="640" cy="720" rx="160" ry="60" fill="#FF8A74" opacity=".25"/>
  </g>

  <!-- 5 · dust in the beams -->
  <g fill="#DCEBFF" opacity=".55">
    <circle cx="300" cy="180" r="1.6"/><circle cx="364" cy="300" r="1.2"/><circle cx="412" cy="420" r="1.8"/><circle cx="470" cy="560" r="1.3"/>
    <circle cx="560" cy="160" r="1.4"/><circle cx="620" cy="330" r="1.7"/><circle cx="700" cy="480" r="1.2"/><circle cx="760" cy="600" r="1.6"/>
    <circle cx="840" cy="140" r="1.5"/><circle cx="900" cy="290" r="1.3"/><circle cx="960" cy="450" r="1.8"/><circle cx="1020" cy="590" r="1.2"/>
    <circle cx="1100" cy="200" r="1.6"/><circle cx="1160" cy="360" r="1.4"/><circle cx="1220" cy="520" r="1.7"/><circle cx="1290" cy="640" r="1.3"/>
    <circle cx="1370" cy="170" r="1.5"/><circle cx="1430" cy="320" r="1.2"/><circle cx="1490" cy="480" r="1.6"/><circle cx="640" cy="90" r="1.8"/>
    <circle cx="520" cy="250" r="1.2"/><circle cx="380" cy="640" r="1.5"/><circle cx="1000" cy="90" r="1.3"/><circle cx="1180" cy="700" r="1.4"/>
    <circle cx="240" cy="520" r="1.6"/><circle cx="860" cy="720" r="1.2"/><circle cx="1320" cy="420" r="1.5"/><circle cx="700" cy="240" r="1.3"/>
  </g>

  <!-- 6 · the crowd, three depths, rim-lit from the stage -->
  <!-- far: small, blue, continuous -->
  <g fill="url(#crowdfar)" stroke="url(#crowdfar)" opacity=".95" transform="translate(0,560) scale(.55)">
    <use xlink:href="#row" x="-80"/><use xlink:href="#row" x="520"/><use xlink:href="#row" x="1120"/>
    <use xlink:href="#row" x="1720"/><use xlink:href="#row" x="2320"/><use xlink:href="#row" x="2920"/>
  </g>
  <!-- rim light on the far crowd -->
  <rect x="0" y="560" width="1600" height="30" fill="url(#wallfade)" opacity=".18" filter="url(#soft)"/>
  <!-- mid -->
  <g fill="url(#crowdmid)" stroke="url(#crowdmid)" transform="translate(0,608) scale(.8)">
    <use xlink:href="#row" x="-200"/><use xlink:href="#row" x="400"/><use xlink:href="#row" x="1000"/>
    <use xlink:href="#row" x="1600"/><use xlink:href="#row" x="2200"/>
    <g transform="translate(-200,0)"><use xlink:href="#phones"/></g>
    <g transform="translate(1000,0)"><use xlink:href="#phones"/></g>
  </g>
  <!-- near: large, nearly black, cropped by the bottom edge -->
  <g fill="url(#crowdnear)" stroke="url(#crowdnear)" transform="translate(0,700) scale(1.15)">
    <use xlink:href="#row" x="-320"/><use xlink:href="#row" x="280"/><use xlink:href="#row" x="880"/>
    <use xlink:href="#row" x="1480"/>
    <g transform="translate(280,0)"><use xlink:href="#phones"/></g>
    <g transform="translate(1480,0)"><use xlink:href="#phones"/></g>
  </g>

  <!-- 7 · vignette so the copy on the left reads -->
  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
